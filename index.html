<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17171c" />

  <title>Lo-fi Radio</title>

  <style>
    :root {
      color-scheme: dark;
      --text: #fff8ef;
      --muted: #c2bcb5;
      --accent: #e9bd91;
      --panel: rgba(24, 23, 28, 0.88);
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      background: #17171c;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* background.png goes beside index.html */
    .background {
      position: fixed;
      inset: 0;
      background: #17171c url("./background.png") center / cover no-repeat;
      pointer-events: none;
    }

    .background-shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to top right,
        rgba(0, 0, 0, 0.48),
        transparent 60%
      );
    }

    button,
    input {
      font: inherit;
    }

    button {
      display: inline-grid;
      place-items: center;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 5px;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    svg {
      display: block;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Bottom-left player */
    .music-popup {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: max(24px, env(safe-area-inset-left));
      width: 370px;
      max-width: calc(100vw - 48px);
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow:
        0 20px 65px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      animation: popup-enter 650ms ease-out both;
    }

    .popup-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .station-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .playing-indicator {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 15px;
    }

    .playing-indicator span {
      width: 3px;
      height: 5px;
      border-radius: 3px;
      background: var(--accent);
    }

    .music-popup.is-playing .playing-indicator span {
      animation: equalizer 800ms ease-in-out infinite alternate;
    }

    .playing-indicator span:nth-child(2) {
      animation-delay: -300ms;
    }

    .playing-indicator span:nth-child(3) {
      animation-delay: -500ms;
    }

    .playing-indicator span:nth-child(4) {
      animation-delay: -100ms;
    }

    .song-row {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    /* Classic square album cover */
    .album-cover {
      position: relative;
      display: grid;
      place-items: center;
      width: 96px;
      height: 96px;
      flex: 0 0 96px;
      overflow: hidden;
      border-radius: 5px;
      background: linear-gradient(135deg, #a77d83, #3c3651);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .album-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: inherit;
      pointer-events: none;
    }

    .album-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .album-cover img[hidden],
    #coverFallback[hidden] {
      display: none;
    }

    #coverFallback {
      font-size: 36px;
      color: rgba(255, 255, 255, 0.75);
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .now-playing-label {
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #songTitle {
      margin: 0;
      overflow: hidden;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #artistName {
      margin: 7px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timeline {
      margin-top: 20px;
    }

    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    #progress {
      display: block;
      width: 100%;
      height: 4px;
      margin: 0;
    }

    .timestamps {
      display: flex;
      justify-content: space-between;
      margin-top: 9px;
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 19px;
      margin-top: 12px;
    }

    .control-button {
      width: 30px;
      height: 34px;
      border-radius: 7px;
      color: var(--muted);
      transition: color 150ms, background 150ms, transform 150ms;
    }

    .control-button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
    }

    .control-button:active,
    #playButton:active {
      transform: scale(0.93);
    }

    .control-button.active {
      color: var(--accent);
      background: rgba(233, 189, 145, 0.1);
    }

    #playButton {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--accent);
      color: #252029;
      transition: transform 150ms, filter 150ms;
    }

    #playButton:hover {
      filter: brightness(1.08);
    }

    #playButton svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      stroke: none;
    }

    .player-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    #trackCount {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
    }

    .volume-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #muteButton {
      width: 24px;
      height: 24px;
      color: var(--muted);
    }

    #muteButton svg {
      width: 16px;
      height: 16px;
    }

    #volume {
      width: 75px;
      height: 3px;
      margin: 0;
    }

    #status {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    #status:empty {
      display: none;
    }

    .track-change {
      animation: track-change 350ms ease-out;
    }

    @keyframes popup-enter {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes track-change {
      from {
        opacity: 0.3;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes equalizer {
      from { height: 4px; }
      to { height: 15px; }
    }

    @media (max-width: 480px) {
      .music-popup {
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        width: 350px;
        max-width: calc(100vw - 32px);
        padding: 17px;
      }

      .album-cover {
        width: 82px;
        height: 82px;
        flex-basis: 82px;
      }

      #songTitle {
        font-size: 17px;
      }

      .controls {
        gap: 16px;
      }
    }

    @media (max-height: 420px) {
      body {
        overflow: auto;
      }

      .music-popup {
        position: relative;
        left: auto;
        bottom: auto;
        margin: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true"></div>
  <div class="background-shade" aria-hidden="true"></div>

  <main class="music-popup" id="musicPopup" aria-label="Music player">
    <div class="popup-heading">
      <span class="station-label">Lo-fi radio</span>

      <div class="playing-indicator" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="song-row" id="songRow">
      <div class="album-cover">
        <img id="coverImage" alt="Album cover" hidden />
        <span id="coverFallback" aria-hidden="true">♫</span>
      </div>

      <div class="song-info">
        <div class="now-playing-label">Now playing</div>
        <h1 id="songTitle">Loading music…</h1>
        <p id="artistName">One moment</p>
      </div>
    </div>

    <div class="timeline">
      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        step="0.1"
        value="0"
        aria-label="Song progress"
        disabled
      />

      <div class="timestamps">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button
        class="control-button"
        id="shuffleButton"
        aria-label="Shuffle"
        aria-pressed="false"
        title="Shuffle"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6h3c5 0 7 12 12 12h3" />
          <path d="m18 15 3 3-3 3" />
          <path d="M3 18h3c2 0 3.5-2 5-5" />
          <path d="M14 8c1.3-1.3 2.5-2 4-2h3" />
          <path d="m18 3 3 3-3 3" />
        </svg>
      </button>

      <button
        class="control-button"
        id="previousButton"
        aria-label="Previous song"
        title="Previous song"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 5v14" />
          <path d="m18 5-10 7 10 7z" fill="currentColor" stroke="none" />
        </svg>
      </button>

      <button id="playButton" aria-label="Play" title="Play" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m8 5 11 7-11 7z" />
        </svg>
      </button>

      <button
        class="control-button"
        id="nextButton"
        aria-label="Next song"
        title="Next song"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 5v14" />
          <path d="m6 5 10 7-10 7z" fill="currentColor" stroke="none" />
        </svg>
      </button>

      <button
        class="control-button"
        id="repeatButton"
        aria-label="Repeat current song"
        aria-pressed="false"
        title="Repeat current song"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V7a3 3 0 0 1 3-3h13" />
          <path d="m17 1 3 3-3 3" />
          <path d="M20 15v2a3 3 0 0 1-3 3H4" />
          <path d="m7 17-3 3 3 3" />
        </svg>
      </button>
    </div>

    <div class="player-footer">
      <span id="trackCount">LOADING</span>

      <div class="volume-controls">
        <button id="muteButton" aria-label="Mute" title="Mute">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4z" />
            <path
              id="soundWaves"
              d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"
            />
            <path id="muteMark" d="m16 9 5 6m0-6-5 6" hidden />
          </svg>
        </button>

        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.7"
          aria-label="Volume"
        />
      </div>
    </div>

    <p id="status" role="status" aria-live="polite">
      Loading your playlist…
    </p>
  </main>

  <audio id="audio" preload="metadata"></audio>

  <script>
    /*
      ADD YOUR SONG FOLDER NAMES HERE.

      Each folder uses its own name for the files:

      songs/song1/song1.mp3
      songs/song1/song1_cover.jpg
      songs/song1/song1_info.txt

      The info file format is:

      -
      SONG NAME: Your Song Name
      ARTIST: Your Artist Name
      -

      The dash lines are optional and ignored.
      Covers can use jpg, png, webp, jpeg, or gif.
    */
    const SONG_FOLDERS = ["song1", "song2", "song3"];

    const $ = (id) => document.getElementById(id);
    const audio = $("audio");

    const PLAY_ICON = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m8 5 11 7-11 7z" />
      </svg>
    `;

    const PAUSE_ICON = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
      </svg>
    `;

    let tracks = [];
    let currentIndex = 0;
    let shuffleEnabled = false;
    let loadVersion = 0;

    audio.volume = Number($("volume").value);

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const remainder = Math.floor(seconds % 60);

      return `${minutes}:${String(remainder).padStart(2, "0")}`;
    }

    /*
      Reads SONG NAME: and ARTIST:
      Ignores blank lines, dash lines, and unrelated text.
      Matching is case-insensitive.
    */
    function parseSongInfo(text, folder) {
      const info = {
        title: folder,
        artist: "Unknown artist"
      };

      for (const rawLine of text.replace(/^\uFEFF/, "").split(/\r?\n/)) {
        const line = rawLine.trim();

        if (!line || /^-+$/.test(line)) continue;

        const match = line.match(
          /^(SONG\s+NAME|ARTIST)\s*:\s*(.*)$/i
        );

        if (!match) continue;

        const field = match[1].replace(/\s+/g, " ").toUpperCase();
        const value = match[2].trim();

        if (!value) continue;

        if (field === "SONG NAME") {
          info.title = value;
        } else if (field === "ARTIST") {
          info.artist = value;
        }
      }

      return info;
    }

    async function readTrack(folder) {
      const encoded = encodeURIComponent(folder);
      const base = `./songs/${encoded}/${encoded}`;

      let info = {
        title: folder,
        artist: "Unknown artist"
      };

      try {
        const response = await fetch(`${base}_info.txt`);

        if (!response.ok) {
          throw new Error("Song information unavailable");
        }

        info = parseSongInfo(await response.text(), folder);
      } catch {
        // Playback can still work if metadata is unavailable.
      }

      return {
        ...info,
        audio: `${base}.mp3`,
        coverBase: `${base}_cover`
      };
    }

    async function loadCover(base, version) {
      $("coverImage").hidden = true;
      $("coverImage").removeAttribute("src");
      $("coverFallback").hidden = false;

      for (const extension of ["jpg", "png", "webp", "jpeg", "gif"]) {
        if (version !== loadVersion) return;

        const source = `${base}.${extension}`;
        const image = new Image();

        const exists = await new Promise((resolve) => {
          image.onload = () => resolve(true);
          image.onerror = () => resolve(false);
          image.src = source;
        });

        if (version !== loadVersion) return;

        if (exists) {
          $("coverImage").src = source;
          $("coverImage").hidden = false;
          $("coverFallback").hidden = true;
          return;
        }
      }
    }

    function updatePlayState() {
      const playing = !audio.paused && !audio.ended;

      $("playButton").innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
      $("playButton").setAttribute("aria-label", playing ? "Pause" : "Play");
      $("playButton").title = playing ? "Pause" : "Play";

      if (!playing) {
        $("musicPopup").classList.remove("is-playing");
      }
    }

    async function playAudio(version = loadVersion) {
      try {
        await audio.play();

        if (version === loadVersion) {
          $("status").textContent = "";
        }
      } catch (error) {
        if (version !== loadVersion || error.name === "AbortError") return;

        $("status").textContent =
          error.name === "NotAllowedError"
            ? "Press play to start listening."
            : "Couldn't play this song. Check the MP3 file or try Next.";

        updatePlayState();
      }
    }

    function loadTrack(index, autoplay = false) {
      if (!tracks.length) return;

      currentIndex = (index + tracks.length) % tracks.length;

      const track = tracks[currentIndex];
      const version = ++loadVersion;

      audio.pause();
      audio.src = track.audio;
      audio.load();

      $("songTitle").textContent = track.title;
      $("songTitle").title = track.title;

      $("artistName").textContent = track.artist;
      $("artistName").title = track.artist;

      $("coverImage").alt = `Album cover for ${track.title}`;

      $("currentTime").textContent = "0:00";
      $("totalTime").textContent = "0:00";
      $("progress").value = 0;
      $("progress").disabled = true;

      $("trackCount").textContent =
        `TRACK ${currentIndex + 1} / ${tracks.length}`;

      $("status").textContent = autoplay
        ? "Loading song…"
        : "Press play. Stay a while.";

      document.title = `${track.title} — ${track.artist}`;

      const row = $("songRow");
      row.classList.remove("track-change");
      void row.offsetWidth;
      row.classList.add("track-change");

      loadCover(track.coverBase, version);

      if (autoplay) playAudio(version);
    }

    function getNextIndex() {
      if (!shuffleEnabled || tracks.length < 2) {
        return currentIndex + 1;
      }

      const offset = 1 + Math.floor(Math.random() * (tracks.length - 1));
      return (currentIndex + offset) % tracks.length;
    }

    $("playButton").addEventListener("click", () => {
      if (audio.paused) {
        playAudio();
      } else {
        audio.pause();
      }
    });

    $("nextButton").addEventListener("click", () => {
      loadTrack(getNextIndex(), true);
    });

    $("previousButton").addEventListener("click", () => {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        loadTrack(currentIndex - 1, true);
      }
    });

    $("shuffleButton").addEventListener("click", () => {
      shuffleEnabled = !shuffleEnabled;

      $("shuffleButton").classList.toggle("active", shuffleEnabled);
      $("shuffleButton").setAttribute(
        "aria-pressed",
        String(shuffleEnabled)
      );
    });

    $("repeatButton").addEventListener("click", () => {
      audio.loop = !audio.loop;

      $("repeatButton").classList.toggle("active", audio.loop);
      $("repeatButton").setAttribute("aria-pressed", String(audio.loop));
    });

    $("progress").addEventListener("input", (event) => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime =
          (Number(event.target.value) / 100) * audio.duration;
      }
    });

    function updateVolumeUI() {
      const silent = audio.muted || audio.volume === 0;

      $("volume").value = audio.muted ? 0 : audio.volume;
      $("soundWaves").style.display = silent ? "none" : "";
      $("muteMark").style.display = silent ? "" : "none";
      $("muteMark").removeAttribute("hidden");

      $("muteButton").setAttribute(
        "aria-label",
        audio.muted ? "Unmute" : "Mute"
      );

      $("muteButton").title = audio.muted ? "Unmute" : "Mute";
    }

    $("volume").addEventListener("input", (event) => {
      audio.volume = Number(event.target.value);
      audio.muted = false;
      updateVolumeUI();
    });

    $("muteButton").addEventListener("click", () => {
      audio.muted = !audio.muted;
      updateVolumeUI();
    });

    audio.addEventListener("loadedmetadata", () => {
      $("totalTime").textContent = formatTime(audio.duration);

      $("progress").disabled =
        !Number.isFinite(audio.duration) || audio.duration <= 0;
    });

    audio.addEventListener("timeupdate", () => {
      $("currentTime").textContent = formatTime(audio.currentTime);

      $("progress").value =
        Number.isFinite(audio.duration) && audio.duration > 0
          ? (audio.currentTime / audio.duration) * 100
          : 0;
    });

    audio.addEventListener("play", updatePlayState);
    audio.addEventListener("pause", updatePlayState);

    audio.addEventListener("playing", () => {
      $("musicPopup").classList.add("is-playing");
      $("status").textContent = "";
    });

    audio.addEventListener("waiting", () => {
      $("musicPopup").classList.remove("is-playing");
    });

    audio.addEventListener("ended", () => {
      if (!audio.loop) {
        loadTrack(getNextIndex(), true);
      }
    });

function showAudioError() {
  const error = audio.error;

  const descriptions = {
    1: "Audio loading was aborted.",
    2: "A network error interrupted audio loading.",
    3: "The browser couldn't decode the audio file.",
    4: "The audio source couldn't be used. Check the file URL and format."
  };

  const description = error
    ? descriptions[error.code] || "Unknown audio error."
    : "No media error details are available yet.";

  const source =
    audio.currentSrc ||
    audio.src ||
    "(No audio URL assigned)";

  $("status").textContent =
    `${description} Requested URL: ${source}` +
    (error?.message ? ` Details: ${error.message}` : "");

  console.error("Audio playback failed:", {
    code: error?.code,
    message: error?.message,
    source
  });
}

audio.addEventListener("error", () => {
  $("musicPopup").classList.remove("is-playing");
  showAudioError();
  updatePlayState();
});

    document.addEventListener("keydown", (event) => {
      const target = event.target;

      if (
        target instanceof HTMLElement &&
        (
          target.matches("input, button, textarea, select") ||
          target.isContentEditable
        )
      ) {
        return;
      }

      if (event.code === "Space" && !$("playButton").disabled) {
        event.preventDefault();
        $("playButton").click();
      }
    });

    async function init() {
      updateVolumeUI();

      if (!SONG_FOLDERS.length) {
        $("songTitle").textContent = "No songs yet";
        $("artistName").textContent = "Your station is waiting";
        $("trackCount").textContent = "0 TRACKS";

        $("status").textContent =
          "Add your folder names to SONG_FOLDERS in this HTML file.";

        $("previousButton").disabled = true;
        $("nextButton").disabled = true;
        return;
      }

      tracks = await Promise.all(SONG_FOLDERS.map(readTrack));

      $("playButton").disabled = false;
      loadTrack(0);
    }

    init();
  </script>
</body>
</html>
