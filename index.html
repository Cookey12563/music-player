<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17171c" />
  <title>Music Player</title>

  <style>
    :root {
      color-scheme: dark;
      --text: #fff8ef;
      --muted: #c2bcb5;
      --accent: #e9bd91;
      --panel: rgba(24, 23, 28, 0.88);
      --border: rgba(255, 255, 255, 0.13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      background: #17171c;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input { font: inherit; }

    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 5px;
    }

    [hidden] { display: none !important; }

    .background {
      position: fixed;
      inset: 0;
      background: #17171c url("./background.png") center / cover no-repeat;
      pointer-events: none;
    }

    .shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to top right,
        rgba(0, 0, 0, 0.4),
        transparent 65%
      );
    }

    .start-area {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: max(24px, env(safe-area-inset-left));
      max-width: calc(100vw - 48px);
    }

    #startButton {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 17px 25px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 12px 40px #0005;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-size: 15px;
      transition: background 180ms, transform 180ms;
    }

    #startButton:hover {
      background: #3a3035;
      transform: translateY(-2px);
    }

    #startButton svg {
      width: 19px;
      height: 19px;
      fill: var(--accent);
    }

    #startStatus {
      max-width: 330px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-shadow: 0 2px 8px #000;
    }

    /* NOW-PLAYING TOAST: slides in and out from the left. */
    .now-playing {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: max(24px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 16px;
      width: 370px;
      max-width: calc(100vw - 48px);
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 18px 55px #0005;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 4;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(
        calc(-100% - max(24px, env(safe-area-inset-left)) - 60px)
      );

      transition:
        transform 450ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 300ms ease,
        visibility 0s linear 450ms;
    }

    .now-playing.visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);

      transition:
        transform 450ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 300ms ease,
        visibility 0s;
    }

    .cover {
      position: relative;
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      flex: 0 0 88px;
      overflow: hidden;
      border-radius: 5px;
      background: linear-gradient(135deg, #a77d83, #3c3651);
      box-shadow: 0 5px 16px #0005;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid #ffffff20;
      border-radius: inherit;
      pointer-events: none;
    }

    #coverFallback { font-size: 34px; }

    .song-info { min-width: 0; flex: 1; }

    .label {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #songTitle {
      margin: 0;
      font-size: 19px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    #artistName {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    /* HIDDEN TOP-RIGHT CONTROL AREA */
    .control-zone {
      position: fixed;
      top: 0;
      right: 0;
      width: 350px;
      max-width: 100vw;
      padding: max(20px, env(safe-area-inset-top)) 20px 30px;
      z-index: 5;
    }

    .control-panel {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--panel);
      box-shadow: 0 15px 45px #0005;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 200ms, transform 200ms;
    }

    .control-zone:hover .control-panel,
    .control-zone:focus-within .control-panel,
    .control-zone.open .control-panel {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #controlsToggle {
      display: block;
      width: 35px;
      height: 30px;
      margin: 0 0 8px auto;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      opacity: 0;
    }

    #controlsToggle:focus-visible,
    .control-zone:hover #controlsToggle,
    .control-zone.open #controlsToggle {
      opacity: 1;
      background: var(--panel);
      border-color: var(--border);
    }

    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    #progress {
      display: block;
      width: 100%;
      height: 4px;
      margin: 0;
    }

    .times {
      display: flex;
      justify-content: space-between;
      margin-top: 9px;
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .transport {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-top: 14px;
    }

    .transport button {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
    }

    .transport button:hover { background: #ffffff10; }

    .transport svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
    }

    #playButton {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      color: #252029;
      background: var(--accent);
    }

    .volume-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .shuffle-label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 1.5px;
    }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #muteButton {
      width: 28px;
      padding: 3px;
      border: 0;
      background: transparent;
      font-size: 11px;
      color: var(--muted);
    }

    #volume { width: 70px; height: 3px; margin: 0; }

    /* Separate status/error messages. */
    #toast {
      position: fixed;
      top: max(24px, env(safe-area-inset-top));
      left: 50%;
      width: max-content;
      max-width: calc(100vw - 40px);
      padding: 13px 19px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 10px 35px #0004;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, -12px);
      pointer-events: none;
      transition: opacity 220ms, transform 220ms;
      z-index: 10;
    }

    #toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (hover: none), (pointer: coarse) {
      #controlsToggle {
        opacity: 0.7;
        background: var(--panel);
        border-color: var(--border);
      }
    }

    @media (max-width: 480px) {
      .start-area, .now-playing {
        left: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
        max-width: calc(100vw - 32px);
      }

      .now-playing { padding: 15px; gap: 13px; }

      .cover {
        width: 75px;
        height: 75px;
        flex-basis: 75px;
      }

      #songTitle { font-size: 17px; }
      .control-zone { padding-right: 16px; padding-left: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="background" id="background" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <div class="start-area" id="startArea">
    <button id="startButton" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m8 5 11 7-11 7z" />
      </svg>
      <span id="startLabel">Finding music…</span>
    </button>
    <p id="startStatus" role="status">Checking your song folders.</p>
  </div>

  <section
    class="now-playing"
    id="nowPlaying"
    aria-label="Now playing"
    hidden
  >
    <div class="cover">
      <img id="coverImage" alt="Album cover" hidden />
      <span id="coverFallback" aria-hidden="true">♫</span>
    </div>

    <div class="song-info">
      <p class="label">Now playing</p>
      <h1 id="songTitle">Unknown song</h1>
      <p id="artistName">Unknown artist</p>
    </div>
  </section>

  <aside class="control-zone" id="controlZone" hidden>
    <button
      id="controlsToggle"
      aria-label="Show playback controls"
      aria-expanded="false"
      aria-controls="controlPanel"
      title="Playback controls"
    >☰</button>

    <section
      class="control-panel"
      id="controlPanel"
      aria-label="Playback controls"
    >
      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        step="0.1"
        value="0"
        aria-label="Song progress"
        disabled
      />

      <div class="times">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>

      <div class="transport">
        <button id="previousButton" aria-label="Previous song" title="Previous song">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5h2v14H5zm14 0L9 12l10 7z" />
          </svg>
        </button>

        <button id="playButton" aria-label="Pause" title="Pause"></button>

        <button id="nextButton" aria-label="Next song" title="Next song">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 5h2v14h-2zM5 5l10 7-10 7z" />
          </svg>
        </button>
      </div>

      <div class="volume-row">
        <span class="shuffle-label">SHUFFLE · CONTINUOUS</span>

        <div class="volume-group">
          <button id="muteButton" aria-label="Mute" title="Mute">VOL</button>
          <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
            aria-label="Volume"
          />
        </div>
      </div>
    </section>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>
  <p id="announcement" class="sr-only" aria-live="polite"></p>

  <audio id="audio" preload="metadata"></audio>

  <script>
    /*
      Folders: song1 through song30.

      Expected files:
        songs/song1/song1.mp3
        songs/song1/song1_cover.jpg
        songs/song1/song1_info.txt

      Info file:
        -
        SONG NAME: Your Song Name
        ARTIST: Your Artist Name
        -

      Covers: jpg, png, webp, or jpeg.
      Background: background.gif with background.png fallback.
    */

    const SONG_FOLDERS = Array.from(
      { length: 30 },
      (_, index) => `song${index + 1}`
    );

    const NOW_PLAYING_DURATION = 5000;

    const $ = (id) => document.getElementById(id);
    const audio = $("audio");

    const PLAY_ICON = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m8 5 11 7-11 7z" />
      </svg>
    `;

    const PAUSE_ICON = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
      </svg>
    `;

    let tracks = [];
    let currentTrack = null;
    let shuffleBag = [];
    let history = [];
    let historyPosition = -1;

    let started = false;
    let starting = false;
    let switching = false;
    let loadVersion = 0;
    let toastTimer;
    let metadataWarning = false;

    let nowPlayingTimer;
    let nowPlayingFrame;
    let shownTrackVersion = -1;

    audio.volume = Number($("volume").value);

    function showToast(message, duration = 5000) {
      clearTimeout(toastTimer);
      $("toast").textContent = message;
      $("toast").classList.add("visible");

      toastTimer = setTimeout(() => {
        $("toast").classList.remove("visible");
      }, duration);
    }

    function hideNowPlaying() {
      clearTimeout(nowPlayingTimer);
      cancelAnimationFrame(nowPlayingFrame);
      $("nowPlaying").classList.remove("visible");
    }

    function showNowPlaying(version) {
      if (version !== loadVersion || shownTrackVersion === version) {
        return;
      }

      shownTrackVersion = version;

      clearTimeout(nowPlayingTimer);
      cancelAnimationFrame(nowPlayingFrame);

      const card = $("nowPlaying");
      card.hidden = false;

      // Commit its off-screen position before sliding it in.
      void card.offsetWidth;

      nowPlayingFrame = requestAnimationFrame(() => {
        if (version !== loadVersion || !started) return;

        card.classList.add("visible");

        nowPlayingTimer = setTimeout(() => {
          if (version === loadVersion) {
            card.classList.remove("visible");
          }
        }, NOW_PLAYING_DURATION);
      });
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";

      return `${Math.floor(seconds / 60)}:${String(
        Math.floor(seconds % 60)
      ).padStart(2, "0")}`;
    }

    function shuffle(items) {
      const result = [...items];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function parseInfo(text) {
      const info = {
        title: "Unknown song",
        artist: "Unknown artist"
      };

      for (const raw of text.replace(/^\uFEFF/, "").split(/\r?\n/)) {
        const line = raw.trim();
        if (!line || /^-+$/.test(line)) continue;

        const match = line.match(/^(SONG\s+NAME|ARTIST)\s*:\s*(.*)$/i);
        if (!match || !match[2].trim()) continue;

        if (/^SONG\s+NAME$/i.test(match[1])) {
          info.title = match[2].trim();
        } else {
          info.artist = match[2].trim();
        }
      }

      return info;
    }

    async function fetchWithTimeout(url, options = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);

      try {
        return await fetch(url, {
          ...options,
          signal: controller.signal
        });
      } finally {
        clearTimeout(timer);
      }
    }

    async function findTrack(folder) {
      const encoded = encodeURIComponent(folder);
      const base = `./songs/${encoded}/${encoded}`;
      const source = `${base}.mp3`;

      try {
        const response = await fetchWithTimeout(source, {
          method: "HEAD"
        });

        if (!response.ok) return null;

        const size = response.headers.get("content-length");
        const type = response.headers.get("content-type") || "";

        if (size !== null && Number(size) < 128) return null;
        if (/text\/html/i.test(type)) return null;

        return {
          id: folder,
          source,
          coverBase: `${base}_cover`,
          infoUrl: `${base}_info.txt`
        };
      } catch {
        return null;
      }
    }

    function nextShuffledTrack() {
      const availableIds = new Set(tracks.map((track) => track.id));

      shuffleBag = shuffleBag.filter((track) =>
        availableIds.has(track.id)
      );

      if (!shuffleBag.length) {
        shuffleBag = shuffle(tracks);

        if (
          shuffleBag.length > 1 &&
          shuffleBag[0].id === currentTrack?.id
        ) {
          [shuffleBag[0], shuffleBag[1]] =
            [shuffleBag[1], shuffleBag[0]];
        }
      }

      return shuffleBag.shift();
    }

    async function displayInfo(track, version) {
      let info = {
        title: "Unknown song",
        artist: "Unknown artist"
      };

      try {
        const response = await fetchWithTimeout(track.infoUrl, {
          cache: "no-cache"
        });

        if (!response.ok) throw new Error("Missing info file");

        info = parseInfo(await response.text());
      } catch {
        if (version === loadVersion && !metadataWarning) {
          metadataWarning = true;
          showToast("Song info couldn't load. Check the _info.txt file.");
        }
      }

      if (version !== loadVersion) return;

      $("songTitle").textContent = info.title;
      $("artistName").textContent = info.artist;
      document.title = `${info.title} — ${info.artist}`;
      $("announcement").textContent =
        `Now playing: ${info.title}, by ${info.artist}`;
    }

    async function displayCover(track, version) {
      $("coverImage").hidden = true;
      $("coverImage").removeAttribute("src");
      $("coverFallback").hidden = false;

      for (const extension of ["jpg", "png", "webp", "jpeg"]) {
        if (version !== loadVersion) return;

        const image = new Image();
        const source = `${track.coverBase}.${extension}`;

        const loaded = await new Promise((resolve) => {
          image.onload = () => resolve(true);
          image.onerror = () => resolve(false);
          image.src = source;
        });

        if (version !== loadVersion) return;

        if (loaded) {
          $("coverImage").src = source;
          $("coverImage").hidden = false;
          $("coverFallback").hidden = true;
          return;
        }
      }
    }

    function updatePlayButton() {
      const playing = !audio.paused && !audio.ended;

      $("playButton").innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
      $("playButton").setAttribute(
        "aria-label",
        playing ? "Pause" : "Play"
      );
      $("playButton").title = playing ? "Pause" : "Play";
    }

    function loadTrack(track, addToHistory = true) {
      if (!track) return;

      hideNowPlaying();

      currentTrack = track;
      switching = false;
      metadataWarning = false;

      const version = ++loadVersion;

      if (addToHistory) {
        history = history.slice(0, historyPosition + 1);
        history.push(track.id);
        historyPosition = history.length - 1;
      }

      audio.pause();
      audio.src = track.source;
      audio.load();

      $("songTitle").textContent = "Loading song info…";
      $("artistName").textContent = "";
      $("currentTime").textContent = "0:00";
      $("totalTime").textContent = "0:00";
      $("progress").value = 0;
      $("progress").disabled = true;

      displayInfo(track, version);
      displayCover(track, version);

      updatePlayButton();
    }

    function revealPlayer() {
      started = true;
      starting = false;

      $("startArea").hidden = true;
      $("controlZone").hidden = false;

      showToast(
        matchMedia("(hover: none)").matches
          ? "Music started. Tap the top-right button for controls."
          : "Music started. Hover in the top-right corner for controls.",
        5000
      );
    }

    function noSongsLeft() {
      ++loadVersion;
      hideNowPlaying();

      audio.pause();
      audio.removeAttribute("src");
      audio.load();

      currentTrack = null;
      starting = false;
      switching = false;
      started = false;

      $("nowPlaying").hidden = true;
      $("controlZone").hidden = true;
      $("startArea").hidden = false;
      $("startButton").disabled = true;
      $("startLabel").textContent = "No playable songs";
      $("startStatus").textContent =
        "Upload working MP3 files into your song folders, then reload.";

      showToast("No playable songs remain.");
    }

    function removeUnavailable(version) {
      if (version !== loadVersion || switching || !currentTrack) return;

      switching = true;

      const shouldContinue = started || starting;
      const failedId = currentTrack.id;

      tracks = tracks.filter((track) => track.id !== failedId);
      shuffleBag = shuffleBag.filter((track) => track.id !== failedId);

      history = history.slice(0, historyPosition + 1)
        .filter((id) => id !== failedId);

      historyPosition = history.length - 1;

      console.warn("Removed unavailable track:", failedId, audio.error);

      if (!tracks.length) {
        noSongsLeft();
        return;
      }

      if (started) showToast("Skipped an unavailable song.");

      loadTrack(nextShuffledTrack());

      if (shouldContinue) playCurrent();
    }

    async function playCurrent() {
      const version = loadVersion;

      try {
        await audio.play();

        if (version !== loadVersion) return;

        if (!started) revealPlayer();

        // Only show once per track load, not on pause/resume.
        showNowPlaying(version);
        updatePlayButton();
      } catch (error) {
        if (version !== loadVersion || error.name === "AbortError") return;

        if (error.name === "NotAllowedError") {
          starting = false;

          if (!started) {
            $("startButton").disabled = false;
            $("startLabel").textContent = "Start music";
            $("startStatus").textContent = "Click again to start playback.";
          } else {
            showToast("Press Play in the top-right controls to resume.");
          }

          updatePlayButton();
          return;
        }

        removeUnavailable(version);
      }
    }

    function nextSong() {
      if (!tracks.length) return;

      while (historyPosition < history.length - 1) {
        historyPosition++;

        const track = tracks.find(
          (item) => item.id === history[historyPosition]
        );

        if (track) {
          loadTrack(track, false);
          playCurrent();
          return;
        }
      }

      loadTrack(nextShuffledTrack());
      playCurrent();
    }

    function previousSong() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }

      while (historyPosition > 0) {
        historyPosition--;

        const track = tracks.find(
          (item) => item.id === history[historyPosition]
        );

        if (track) {
          loadTrack(track, false);
          playCurrent();
          return;
        }
      }

      audio.currentTime = 0;
    }

    $("startButton").addEventListener("click", () => {
      if (!currentTrack) return;

      starting = true;
      $("startButton").disabled = true;
      $("startLabel").textContent = "Starting…";
      $("startStatus").textContent = "";
      playCurrent();
    });

    $("playButton").addEventListener("click", () => {
      if (audio.paused) playCurrent();
      else audio.pause();
    });

    $("nextButton").addEventListener("click", nextSong);
    $("previousButton").addEventListener("click", previousSong);

    $("progress").addEventListener("input", (event) => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime =
          (Number(event.target.value) / 100) * audio.duration;
      }
    });

    function updateVolume() {
      $("volume").value = audio.muted ? 0 : audio.volume;
      $("muteButton").textContent =
        audio.muted || audio.volume === 0 ? "OFF" : "VOL";

      $("muteButton").setAttribute(
        "aria-label",
        audio.muted ? "Unmute" : "Mute"
      );

      $("muteButton").title = audio.muted ? "Unmute" : "Mute";
    }

    $("volume").addEventListener("input", (event) => {
      audio.volume = Number(event.target.value);
      audio.muted = false;
      updateVolume();
    });

    $("muteButton").addEventListener("click", () => {
      audio.muted = !audio.muted;
      updateVolume();
    });

    $("controlsToggle").addEventListener("click", () => {
      const open = $("controlZone").classList.toggle("open");
      $("controlsToggle").setAttribute("aria-expanded", String(open));
    });

    document.addEventListener("pointerdown", (event) => {
      if (!$("controlZone").contains(event.target)) {
        $("controlZone").classList.remove("open");
        $("controlsToggle").setAttribute("aria-expanded", "false");
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        $("controlZone").classList.remove("open");
        $("controlsToggle").setAttribute("aria-expanded", "false");

        if ($("controlZone").contains(document.activeElement)) {
          document.activeElement.blur();
        }
      }

      const target = event.target;

      if (
        target instanceof HTMLElement &&
        (
          target.matches("button, input, textarea, select") ||
          target.isContentEditable
        )
      ) return;

      if (event.code === "Space" && started) {
        event.preventDefault();
        $("playButton").click();
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      $("totalTime").textContent = formatTime(audio.duration);
      $("progress").disabled =
        !Number.isFinite(audio.duration) || audio.duration <= 0;
    });

    audio.addEventListener("timeupdate", () => {
      $("currentTime").textContent = formatTime(audio.currentTime);

      $("progress").value =
        Number.isFinite(audio.duration) && audio.duration > 0
          ? (audio.currentTime / audio.duration) * 100
          : 0;
    });

    audio.addEventListener("play", updatePlayButton);
    audio.addEventListener("pause", updatePlayButton);
    audio.addEventListener("ended", nextSong);

    audio.addEventListener("error", () => {
      if (audio.error && currentTrack) {
        removeUnavailable(loadVersion);
      }
    });

    function loadBackground() {
      const gif = new Image();

      gif.onload = () => {
        $("background").style.backgroundImage =
          'url("./background.gif")';
      };

      gif.src = "./background.gif";
    }

    async function init() {
      loadBackground();
      updateVolume();
      updatePlayButton();

      const found = [];

      for (let i = 0; i < SONG_FOLDERS.length; i += 6) {
        const batch = await Promise.all(
          SONG_FOLDERS.slice(i, i + 6).map(findTrack)
        );

        found.push(...batch.filter(Boolean));

        $("startStatus").textContent =
          `Checked ${Math.min(i + 6, SONG_FOLDERS.length)} ` +
          `of ${SONG_FOLDERS.length} song folders…`;
      }

      tracks = found;

      if (!tracks.length) {
        noSongsLeft();
        return;
      }

      loadTrack(nextShuffledTrack());

      $("startButton").disabled = false;
      $("startLabel").textContent = "Start music";
      $("startStatus").textContent =
        `${tracks.length} song${tracks.length === 1 ? "" : "s"} ready. ` +
        "Shuffled and ready to loop.";
    }

    init();
  </script>
</body>
</html>
